name: Publish Tallow API reference
on:
  workflow_dispatch:
  push:
    branches: [main, ecs]
    paths:
      - 'Engine/**/*.bf'
      - 'tools/generate_api_docs.py'
      - '.github/workflows/publish-api-docs.yml'
permissions:
  contents: write
concurrency:
  group: api-docs-publish
  cancel-in-progress: false
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: true
      # main is the C# engine (0.3): its index is generated from the C# gameplay API (Managed/Tallow.API and
      # Managed/Tallow.Editor), at the site's root. Other branches (the retired 0.2 ECS branch) still index their
      # Beef declarations under their branch name.
      - name: Generate static API index
        run: |
          out=site
          kind=beef
          if [ "${{ github.ref_name }}" != main ]; then out="site/${{ github.ref_name }}"; mkdir -p "$out"; else kind=csharp; fi
          echo "API_OUT=${out#site}" >> "$GITHUB_ENV"
          python3 engine/tools/generate_api_docs.py --root engine --output "$out" --commit "${{ github.sha }}" --kind "$kind"
      - name: Publish only generated API files
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".${API_OUT}/api.html" ".${API_OUT}/api-index.json"
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh generated API reference (${{ github.ref_name }}) for ${{ github.sha }}"
            git push origin HEAD:gh-pages
          fi
