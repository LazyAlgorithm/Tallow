name: C# gameplay prototype

on:
  push:
    branches:
      - feature/csharp-gameplay
  pull_request:
    paths:
      - 'Managed/**'
      - 'Tests/CSharpGameplay/**'
      - '.github/workflows/csharp-gameplay.yml'

jobs:
  managed-build:
    name: Build and smoke-test trusted C# assemblies
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build managed gameplay API
        run: dotnet build Managed/Tallow.API/Tallow.API.csproj -c Debug --nologo
      - name: Build Roslyn language service
        run: dotnet build Managed/Tallow.LanguageService/Tallow.LanguageService.csproj -c Debug --nologo
      - name: Verify Roslyn editor features and UTF-8 offsets
        run: dotnet run --project Managed/Tallow.LanguageService.Tests/Tallow.LanguageService.Tests.csproj -- Managed/Tallow.LanguageService/bin/Debug/net11.0/Tallow.LanguageService.dll
      - name: Generate and compile game + asmdef assemblies
        run: dotnet run --project Managed/Tallow.Build/Tallow.Build.csproj -- --project Tests/CSharpGameplay --engine-root .
      - name: Smoke-test trusted assembly lifecycle
        run: dotnet run --project Managed/Tallow.ManagedHost/Tallow.ManagedHost.csproj -- Tests/CSharpGameplay/.tallow-csharp/bin/Tallow.Game/Tallow.Game.dll
      - name: Build trusted managed runtime
        run: dotnet build Managed/Tallow.ManagedRuntime/Tallow.ManagedRuntime.csproj -c Debug --nologo
      - name: Compile native hostfxr shim
        run: |
          cmake -S Tests/NativeCSharpHost -B Tests/NativeCSharpHost/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Tests/NativeCSharpHost/build --config Release
      - name: Test in-process C# gameplay (Linux)
        if: runner.os == 'Linux'
        run: |
          Tests/NativeCSharpHost/build/tallow_native_csharp_smoke Managed/Tallow.ManagedRuntime/bin/Debug/net11.0/Tallow.ManagedRuntime.runtimeconfig.json Managed/Tallow.ManagedRuntime/bin/Debug/net11.0/Tallow.ManagedRuntime.dll Tests/CSharpGameplay/.tallow-csharp/bin/Tallow.Game/Tallow.Game.dll
      - name: Test in-process C# gameplay (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & Tests/NativeCSharpHost/build/Release/tallow_native_csharp_smoke.exe Managed/Tallow.ManagedRuntime/bin/Debug/net11.0/Tallow.ManagedRuntime.runtimeconfig.json Managed/Tallow.ManagedRuntime/bin/Debug/net11.0/Tallow.ManagedRuntime.dll Tests/CSharpGameplay/.tallow-csharp/bin/Tallow.Game/Tallow.Game.dll
