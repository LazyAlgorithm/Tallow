          path: build/native
          key: native-linux-${{ hashFiles('native/**', 'third_party/**', '.github/scripts/native-deps.sh') }}
      - name: Compile native dependencies
        run: |
          python3 tools/patch_textedit.py
          if [ ! -f build/native/CMakeCache.txt ]; then
            cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build/native -j 4 --target $NATIVE_TARGETS
