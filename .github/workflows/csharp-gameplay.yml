  native-editor-linux:
    name: Compile complete native Beef editor (Linux)
    # Managed host tests do not compile Editor, Launcher or the full Beef Engine.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BEEF_COMMIT: b62833e327d6b08f3566b31102c57646de6916b0
      LLVM_VERSION: '22'
      NATIVE_TARGETS: tallow_native bgfx bimg bimg_decode bx SDL3-static joltc Jolt enet shaderc texturec tallow_modelsettings tallow_modelconv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Install compiler and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake zip xz-utils curl \
            libx11-dev libxext-dev libxi-dev libxfixes-dev libxcursor-dev libxrandr-dev \
            libxss-dev libxrender-dev libgl-dev libegl-dev libasound2-dev \
            libpulse-dev libwayland-dev libxkbcommon-dev \
            libffi-dev zlib1g-dev libzstd-dev libxml2-dev libedit-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "clang-$LLVM_VERSION" "lld-$LLVM_VERSION"
          for tool in clang clang++ llvm-ar llvm-config; do
            sudo ln -sf "/usr/lib/llvm-$LLVM_VERSION/bin/$tool" "/usr/local/bin/$tool"
          done
      - name: Cache pinned Beef compiler
        id: beef-cache
