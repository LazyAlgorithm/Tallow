name: Publish developer toolchain assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-toolchain.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Download Beef compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o BeefSetup.exe https://nightly.beeflang.org/BeefSetup.exe
          mkdir -p beef
          7z x -y BeefSetup.exe -obeef >/dev/null
          test -s beef/bin/BeefBuild.exe
          if [ ! -s beef/BeefLibs/corlib/BeefProj.toml ]; then
            echo "Beef installer has no standard libraries; including them from pinned upstream Beef source."
            git clone --filter=blob:none --no-checkout https://github.com/beefytech/Beef.git beef-source
            git -C beef-source checkout b62833e327d6b08f3566b31102c57646de6916b0 -- BeefLibs
            cp -R beef-source/BeefLibs beef/BeefLibs
            rm -rf beef-source
          fi
          test -s beef/BeefLibs/corlib/BeefProj.toml || { echo "Beef package is missing corlib; refusing to publish incomplete toolchain." >&2; exit 1; }
          7z a -tzip -mx=9 beef-windows-x64.zip beef >/dev/null
      - name: Download Python 3.12 embeddable
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o python-embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          mkdir -p python
          7z x -y python-embed.zip -opython >/dev/null
          test -s python/python.exe
          7z a -tzip -mx=9 python-windows-x64.zip python >/dev/null
      - name: Attach toolchains to preserved beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0-beta beef-windows-x64.zip python-windows-x64.zip --repo "$GITHUB_REPOSITORY" --clobber
