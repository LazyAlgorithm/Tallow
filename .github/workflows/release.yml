# Builds the Tallow editor for Linux, Windows and macOS (Intel) with tools/package_engine.py (the same packages the
# editor's File > Build makes with Build: Editor), zips each, and puts them on a GitHub release. Every zip carries the
# Linux, Windows and macOS players and the web player's pieces (built on each machine and added by the release job),
# so any machine exports games for all of them with .NET alone.
#
# When it runs:
#   - a version tag is pushed (git tag v0.5 && git push origin v0.5): a release named after the tag;
#   - a push to main: a pre-release of the C# engine's 0.3 series (v0.3.N-beta since the cutover); a push to ecs (the
#     ECS engine): a pre-release v0.2.N-beta; other branches: v0.1.N-beta
#     (tools/release_version.sh picks the series from the branch's history);
#   - a push to dev: Windows/Linux packages and project-open checks, without publication;
#   - by hand, from the Actions tab (Run workflow): the same, or the zips only as downloadable artifacts.
#
# Linux, Windows and macOS build at the same time, each on its own system: Linux on Ubuntu 22.04 (glibc 2.35, so it
# runs on most current distributions), Windows on a Windows machine with Microsoft's compiler tools, macOS on an Intel
# Mac (macos-15-intel; Apple silicon builds from the same source but is not checked on a real machine yet). The third-party native
# libraries are kept in the Actions cache (.github/scripts/native-deps.sh) and only built again when third_party/ or
# the native CMake setup changes; the Beef compilers are cached too. A fourth job puts the zips on the release.
name: Engine release

on:
  push:
    tags: ['v*']
    branches: [dev, main, ecs]
  workflow_dispatch:
    inputs:
      publish:
        description: Make a pre-release (otherwise the zips are only attached to the run)
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Beef's compiler for Linux, built from source. Windows uses Beef's own Windows release.
  BEEF_COMMIT: b62833e327d6b08f3566b31102c57646de6916b0
  LLVM_VERSION: '22'
  NATIVE_TARGETS: tallow_native bgfx bimg bimg_decode bx SDL3-static joltc Jolt enet shaderc texturec tallow_modelsettings tallow_modelconv
  # Emscripten for Beef's WebAssembly runtime (pinned here: LLVM 22, like Beef's).
  EMSCRIPTEN_VERSION: '4.0.23'

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        # A failing step repeats the end of its output on the run's page (.github/scripts/step.sh).
        shell: bash tallow/.github/scripts/step.sh {0}
    steps:
      - name: Get Tallow
        uses: actions/checkout@v4
        with:
          path: tallow
          fetch-depth: 0

      - name: Determine beta version
        run: echo "TALLOW_VERSION=$(bash tallow/tools/release_version.sh)" >> "$GITHUB_ENV"

      # The build scripts need Python 3.11 or later (tomllib); Ubuntu 22.04 has 3.10.
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Tallow .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: tallow/global.json

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake zip xz-utils curl \
            libx11-dev libxext-dev libxi-dev libxfixes-dev libxcursor-dev libxrandr-dev libxss-dev libxrender-dev \
            libgl-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
            libffi-dev zlib1g-dev libzstd-dev libxml2-dev libedit-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "clang-$LLVM_VERSION" "lld-$LLVM_VERSION"
          for tool in clang clang++ llvm-ar llvm-config; do
            sudo ln -sf "/usr/lib/llvm-$LLVM_VERSION/bin/$tool" "/usr/local/bin/$tool"
          done

      # Restored and saved as separate steps, so that what a run builds is kept even if a later step fails.
      - name: Cache the Beef compiler
        id: beef-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/beef
          key: beef-${{ env.BEEF_COMMIT }}-llvm${{ env.LLVM_VERSION }}-jammy-${{ hashFiles('tallow/tools/beef-patches/**') }}

      - name: Build the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/beefytech/Beef ~/beef
          git -C ~/beef checkout "$BEEF_COMMIT"
          # Tallow's fixes to the compiler (tools/beef-patches: small integer arguments widened as the C calling
          # conventions of x86-64 Linux, macOS and Android expect).
          for patch in tallow/tools/beef-patches/*.patch; do git -C ~/beef apply "$PWD/$patch"; done
          cd ~/beef/bin && ./build.sh

      - name: Keep the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/beef
          key: beef-${{ env.BEEF_COMMIT }}-llvm${{ env.LLVM_VERSION }}-jammy-${{ hashFiles('tallow/tools/beef-patches/**') }}

      - name: Native library cache key
        id: native-key
        run: echo "key=$(tallow/.github/scripts/native-deps.sh key linux)" >> "$GITHUB_OUTPUT"

      - name: Cache the native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: tallow/build/native
          key: ${{ steps.native-key.outputs.key }}

      - name: Cache the Rapier library
        id: rapier-cache
        uses: actions/cache@v4
        with:
          path: tallow/third_party/rapier/prebuilt/linux-x86_64/librapier3d_ffi.a
          key: rapier-linux-${{ hashFiles('tallow/third_party/rapier/VERSION', 'tallow/third_party/rapier/bindings-changes/**', 'tallow/tools/build_rapier.py') }}

      # Rapier, the second 3D physics backend, is Rust: built here so the downloads include it.
      - name: Rapier library
        if: steps.rapier-cache.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update && rustup default stable
          cd tallow && python3 tools/build_rapier.py --platform linux

      - name: Native libraries
        run: |
          [ "${{ steps.native-cache.outputs.cache-hit }}" = "true" ] && tallow/.github/scripts/native-deps.sh settle
          cd tallow
          python3 tools/patch_textedit.py
          # Always configure: it is where the Rapier library is found and linked (a cached build folder predates it).
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native -j "$(nproc)" --target $NATIVE_TARGETS
          # The release must ship Rapier: stop if only the empty stand-in archive is there.
          test "$(stat -c %s build/native/rapier/librapier3d_ffi.a)" -gt 100000

      - name: Keep the native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tallow/build/native
          key: ${{ steps.native-key.outputs.key }}

      # What a C# game for the web is linked from, so engine packages export web games with .NET alone: Beef's
      # WebAssembly runtime, the player compiled for wasm32, and the engine's native libraries built with the
      # Emscripten of .NET's wasm-tools workload (Tallow.Build web-setup --engine-pieces).
      - name: Web player pieces
        run: |
          export BEEFBUILD="$HOME/beef/IDE/dist/BeefBuild"
          git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          ~/emsdk/emsdk install "$EMSCRIPTEN_VERSION" > /dev/null
          ~/emsdk/emsdk activate "$EMSCRIPTEN_VERSION" > /dev/null
          (source ~/emsdk/emsdk_env.sh > /dev/null && cd ~/beef/wasm && ./build_wasm.sh release)
          # Beef compiles the wasm32 player through that Emscripten ([Wasm] EmscriptenPath in BeefSettings.toml).
          settings="$HOME/beef/IDE/dist/BeefSettings.toml"
          [ -f "$settings" ] || echo 'FileVersion = 1' > "$settings"
          grep -q '^\[Wasm\]' "$settings" || printf '\n[Wasm]\nEmscriptenPath = "%s/"\n' "$HOME/emsdk" >> "$settings"
          dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          if [ -w "$dotnet_root" ]; then dotnet workload install wasm-tools; else sudo -E env "PATH=$PATH" dotnet workload install wasm-tools; fi
          cd tallow
          dotnet build Managed/Tallow.Build/Tallow.Build.csproj -c Debug --nologo -v minimal
          dotnet Managed/Tallow.Build/bin/Debug/net11.0/Tallow.Build.dll web-setup . --engine-pieces
          ls -la build/web-player/*.a build/native-web-dotnet/libtallow_native.a

      - name: Build and package
        run: |
          export BEEFBUILD="$HOME/beef/IDE/dist/BeefBuild"
          cd tallow
          python3 tools/package_engine.py --platform linux --folder ../out/Tallow-Linux
          cd ../out && zip -qr9 Tallow-Linux.zip Tallow-Linux

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Tallow-Linux
          path: out/Tallow-Linux.zip

      # For the other systems' packages: the Linux player and the web player's pieces.
      - name: Keep the Linux player and web pieces
        run: |
          cd tallow
          tar -cf ../out/extras-linux.tar Player/build/Release_Linux64/TallowPlayer/TallowPlayer \
            build/web-player/libTallowPlayer_Release.a build/web-player/Beef*_dotnet.a \
            $(for lib in libtallow_native.a bgfx/cmake/bgfx/libbgfx.a bgfx/cmake/bimg/libbimg.a bgfx/cmake/bimg/libbimg_decode.a \
                bgfx/cmake/bx/libbx.a SDL/libSDL3.a joltc/libjoltc.a _deps/joltphysics-build/libJolt.a enet/libenet.a; do
                echo build/native-web-dotnet/$lib; done)

      - name: Upload the Linux player and web pieces
        uses: actions/upload-artifact@v4
        with:
          name: extras-linux
          path: out/extras-linux.tar
          retention-days: 3

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # The build scripts read and write UTF-8 text, whatever the machine's own code page.
      PYTHONUTF8: '1'
      # Sign releases with SignPath when this repository is set up for it. Without the
      # repository variable the build stays unsigned, so forks and dev pushes keep working.
      SIGN_RELEASES: ${{ vars.SIGNPATH_PROJECT_SLUG != '' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ecs' || github.ref == 'refs/heads/release' || inputs.publish) }}
    defaults:
      run:
        shell: bash tallow/.github/scripts/step.sh {0}
    steps:
      # Scripts are run by bash: keep their line endings as they are in the repository.
      - name: Line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Get Tallow
        uses: actions/checkout@v4
        with:
          path: tallow
          fetch-depth: 0

      - name: Determine beta version
        run: echo "TALLOW_VERSION=$(bash tallow/tools/release_version.sh)" >> "$GITHUB_ENV"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Tallow .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: tallow/global.json

      # Microsoft's compiler environment (the C runtime and Windows SDK), used by clang-cl and Beef's linker.
      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: |
          python -m pip install --quiet ninja
          ninja --version
          clang-cl --version | head -1

      - name: Cache the Beef compiler
        id: beef-cache
        uses: actions/cache@v4
        with:
          path: beef-win
          key: beef-win-v1

      - name: Get the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o BeefSetup.exe http://nightly.beeflang.org/BeefSetup.exe
          mkdir -p beef-win && (cd beef-win && 7z x -y ../BeefSetup.exe > /dev/null)
          rm -f BeefSetup.exe

      - name: Native library cache key
        id: native-key
        run: echo "key=$(tallow/.github/scripts/native-deps.sh key windows)" >> "$GITHUB_OUTPUT"

      - name: Cache the native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: tallow/build/native-win
          key: ${{ steps.native-key.outputs.key }}

      - name: Cache the Rapier library
        id: rapier-cache
        uses: actions/cache@v4
        with:
          path: tallow/third_party/rapier/prebuilt/windows-x86_64/rapier3d_ffi.lib
          key: rapier-windows-${{ hashFiles('tallow/third_party/rapier/VERSION', 'tallow/third_party/rapier/bindings-changes/**', 'tallow/tools/build_rapier.py') }}

      # Rapier, the second 3D physics backend, is Rust: built here so the downloads include it.
      - name: Rapier library
        if: steps.rapier-cache.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update && rustup default stable
          cd tallow && python tools/build_rapier.py --platform windows

      - name: Native libraries
        run: |
          [ "${{ steps.native-cache.outputs.cache-hit }}" = "true" ] && tallow/.github/scripts/native-deps.sh settle
          cd tallow
          python tools/patch_textedit.py
          # Beef links Windows programs against the static C runtime; so must everything linked into them.
          # Always configure: it is where the Rapier library is found and linked (a cached build folder predates it).
          cmake -S native -B build/native-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          cmake --build build/native-win -j "$NUMBER_OF_PROCESSORS" --target $NATIVE_TARGETS
          # The release must ship Rapier: stop if only the empty stand-in archive is there.
          test "$(stat -c %s build/native-win/rapier/rapier3d_ffi.lib)" -gt 100000

      - name: Keep the native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tallow/build/native-win
          key: ${{ steps.native-key.outputs.key }}

      - name: Build and package
        run: |
          # Beef finds its libraries beside itself.
          printf 'Version = 1\nUnversionedLibDirs = ["../BeefLibs"]\n' > beef-win/bin/BeefConfig.toml
          export BEEFBUILD="$(cygpath -w "$PWD/beef-win/bin/BeefBuild.exe")"
          cd tallow
          python tools/package_engine.py --platform windows --folder ../out/Tallow-Windows

      # Microsoft Defender SmartScreen and Smart App Control block an unsigned editor. SignPath Foundation
      # (free for open-source projects) signs Tallow.exe in its HSM; the record of the signing request and the
      # certificate are in SignPath's audit log. Set up the project, policy and artifact configuration there
      # (an example is in .signpath/artifact-configuration.xml), then add the secrets and variables named below.
      - name: Upload the package for signing
        id: sign-upload
        if: env.SIGN_RELEASES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Tallow-Windows-unsigned
          path: out/Tallow-Windows
          if-no-files-found: error
          retention-days: 1

      - name: Sign Tallow.exe
        if: env.SIGN_RELEASES == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.sign-upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          wait-for-completion-timeout-in-seconds: 1200

      - name: Put the signed editor in place
        if: env.SIGN_RELEASES == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # SignPath returns the artifact extracted, or still in a zip depending on the configuration.
          $zip = Get-ChildItem -LiteralPath signed -Recurse -Filter *.zip -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($zip) { Expand-Archive -LiteralPath $zip.FullName -DestinationPath (Join-Path signed "extracted") -Force }
          $root = if (Test-Path (Join-Path signed "extracted")) { Join-Path signed "extracted" } else { signed }
          $exe = Get-ChildItem -LiteralPath $root -Recurse -Filter Tallow.exe | Select-Object -First 1
          if (-not $exe) { throw "SignPath returned no Tallow.exe" }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          if ($signature.Status -eq "NotSigned") { throw "SignPath returned Tallow.exe without a signature" }
          Write-Host "Signed Tallow.exe: $($signature.Status), $($signature.SignerCertificate.Subject)"
          Copy-Item -LiteralPath $exe.FullName -Destination out/Tallow-Windows/Tallow.exe -Force

      - name: Zip the package
        run: cd out && 7z a -tzip -mx=9 Tallow-Windows.zip Tallow-Windows > /dev/null

      # For the other systems' packages: the Windows player.
      - name: Keep the Windows player
        run: cd tallow && tar -cf ../out/extras-windows.tar Player/build/Release_Win64/TallowPlayer/TallowPlayer.exe

      - name: Upload the Windows player
        uses: actions/upload-artifact@v4
        with:
          name: extras-windows
          path: out/extras-windows.tar
          retention-days: 3

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Tallow-Windows
          path: out/Tallow-Windows.zip

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash tallow/.github/scripts/step.sh {0}
    steps:
      - name: Get Tallow
        uses: actions/checkout@v4
        with:
          path: tallow
          fetch-depth: 0

      - name: Determine beta version
        run: echo "TALLOW_VERSION=$(bash tallow/tools/release_version.sh)" >> "$GITHUB_ENV"

      - name: Install the Tallow .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: tallow/global.json

      - name: Install build tools
        run: |
          brew install ninja "llvm@$LLVM_VERSION" || brew install ninja llvm
          prefix="$(brew --prefix "llvm@$LLVM_VERSION" 2>/dev/null || brew --prefix llvm)"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/llvm-config" --version

      - name: Cache the Beef compiler
        id: beef-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/beef
          key: beef-${{ env.BEEF_COMMIT }}-llvm${{ env.LLVM_VERSION }}-macos15-x86_64-${{ hashFiles('tallow/tools/beef-patches/**') }}

      - name: Build the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/beefytech/Beef ~/beef
          git -C ~/beef checkout "$BEEF_COMMIT"
          # Tallow's fixes to the compiler (tools/beef-patches: small integer arguments widened as the C calling
          # conventions of x86-64 Linux, macOS and Android expect).
          for patch in tallow/tools/beef-patches/*.patch; do git -C ~/beef apply "$PWD/$patch"; done
          cd ~/beef/bin && ./build.sh

      - name: Keep the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/beef
          key: beef-${{ env.BEEF_COMMIT }}-llvm${{ env.LLVM_VERSION }}-macos15-x86_64-${{ hashFiles('tallow/tools/beef-patches/**') }}

      - name: Native library cache key
        id: native-key
        run: echo "key=$(tallow/.github/scripts/native-deps.sh key macos-x86_64)" >> "$GITHUB_OUTPUT"

      - name: Cache the native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: tallow/build/native
          key: ${{ steps.native-key.outputs.key }}

      - name: Cache the Rapier library
        id: rapier-cache
        uses: actions/cache@v4
        with:
          path: tallow/third_party/rapier/prebuilt/macos-x86_64/librapier3d_ffi.a
          key: rapier-macos-x86_64-${{ hashFiles('tallow/third_party/rapier/VERSION', 'tallow/third_party/rapier/bindings-changes/**', 'tallow/tools/build_rapier.py') }}

      # Rapier, the second 3D physics backend, is Rust: built here so the macOS download includes it too.
      - name: Rapier library
        if: steps.rapier-cache.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update && rustup default stable
          cd tallow && python3 tools/build_rapier.py --platform macos

      - name: Native libraries
        run: |
          [ "${{ steps.native-cache.outputs.cache-hit }}" = "true" ] && tallow/.github/scripts/native-deps.sh settle
          cd tallow
          python3 tools/patch_textedit.py
          # Always configure: it is where the Rapier library is found and linked (a cached build folder predates it).
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++
          cmake --build build/native -j "$(sysctl -n hw.ncpu)" --target $NATIVE_TARGETS
          # The release must ship Rapier: stop if only the stand-in archive is there.
          test "$(stat -f %z build/native/rapier/librapier3d_ffi.a)" -gt 100000

      - name: Keep the native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tallow/build/native
          key: ${{ steps.native-key.outputs.key }}

      - name: Build and package
        run: |
          export BEEFBUILD="$HOME/beef/IDE/dist/BeefBuild"
          cd tallow
          python3 tools/package_engine.py --platform macos --folder ../out/Tallow-macOS
          cd ../out && zip -qry9 Tallow-macOS.zip Tallow-macOS

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Tallow-macOS
          path: out/Tallow-macOS.zip

      # For the other systems' packages: the macOS player (tar keeps its executable permission).
      - name: Keep the macOS player
        run: cd tallow && tar -cf ../out/extras-macos.tar Player/build/Release_macOS/TallowPlayer/TallowPlayer

      - name: Upload the macOS player
        uses: actions/upload-artifact@v4
        with:
          name: extras-macos
          path: out/extras-macos.tar
          retention-days: 3

  # The Android platform module (Tallow-Platform-Android.zip, added in the editor's Platforms window): the engine and
  # player for arm64 phones and the x86_64 emulator, and SDL's Java activity, made with Google's NDK
  # (tools/android/build_player.sh). Engine packages leave it out; the editor downloads it from this release.
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # A problem in the Android module never holds up the desktop release.
    continue-on-error: true
    defaults:
      run:
        shell: bash tallow/.github/scripts/step.sh {0}
    steps:
      - name: Get Tallow
        uses: actions/checkout@v4
        with:
          path: tallow
          fetch-depth: 0

      - name: Install the Tallow .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: tallow/global.json

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Java for the Android tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake zip xz-utils curl \
            libffi-dev zlib1g-dev libzstd-dev libxml2-dev libedit-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "clang-$LLVM_VERSION" "lld-$LLVM_VERSION"
          for tool in clang clang++ llvm-ar llvm-config; do
            sudo ln -sf "/usr/lib/llvm-$LLVM_VERSION/bin/$tool" "/usr/local/bin/$tool"
          done
          # The NDK Tallow pins (Managed/Tallow.Build/Export/Android.cs NdkVersion), and a platform and build tools.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      # The same compiler as the Linux job (same cache).
      - name: Cache the Beef compiler
        id: beef-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/beef
          key: beef-${{ env.BEEF_COMMIT }}-llvm${{ env.LLVM_VERSION }}-jammy-${{ hashFiles('tallow/tools/beef-patches/**') }}

      - name: Build the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/beefytech/Beef ~/beef
          git -C ~/beef checkout "$BEEF_COMMIT"
          for patch in tallow/tools/beef-patches/*.patch; do git -C ~/beef apply "$PWD/$patch"; done
          cd ~/beef/bin && ./build.sh

      - name: Android player
        run: |
          export BEEFBUILD="$HOME/beef/IDE/dist/BeefBuild" BEEF_SOURCE="$HOME/beef"
          cd tallow
          # The C# API bindings are generated (gitignored); the player's native exports come from them.
          dotnet run --project Managed/Tallow.BindingGen/Tallow.BindingGen.csproj -- --manifest Managed/Tallow.BindingGen/csharp-api-manifest.tsv --engine-root .
          tools/android/build_player.sh
          dotnet build Managed/Tallow.Build/Tallow.Build.csproj -c Debug --nologo -v minimal
          mkdir -p ../out
          dotnet Managed/Tallow.Build/bin/Debug/net11.0/Tallow.Build.dll platform-pack android --output ../out/Tallow-Platform-Android.zip --engine-root . --build "$GITHUB_SHA"

      - name: Keep the Android module
        uses: actions/upload-artifact@v4
        with:
          name: Tallow-Platform-Android
          path: out/Tallow-Platform-Android.zip

  # Every run puts the complete zips (each with all the players) on the run as Tallow-packages; pushes to main, ecs,
  # release and tags (or Run workflow with publish) also make the release.
  release:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-22.04
    env:
      PUBLISH: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ecs' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/'))) || inputs.publish }}
    steps:
      - name: Get Tallow version history
        uses: actions/checkout@v4
        with:
          path: tallow
          fetch-depth: 0

      - name: Determine beta version
        run: echo "TALLOW_VERSION=$(bash tallow/tools/release_version.sh)" >> "$GITHUB_ENV"

      # Only the finished zips: the unsigned package a signing run uploads for SignPath stays out of the release.
      - name: Get the zips
        uses: actions/download-artifact@v4
        with:
          name: Tallow-Windows
          path: out

      - name: Get the Linux zip
        uses: actions/download-artifact@v4
        with:
          name: Tallow-Linux
          path: out

      - name: Get the macOS zip
        uses: actions/download-artifact@v4
        with:
          name: Tallow-macOS
          path: out

      - name: Get the Android module
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Tallow-Platform-Android
          path: out

      - name: Get the players and web pieces
        uses: actions/download-artifact@v4
        with:
          pattern: extras-*
          path: extras
          merge-multiple: true

      # Every package exports Linux, Windows, macOS and web games: each gets the players and web pieces it did not build.
      - name: Add the players and web pieces to every zip
        run: |
          mkdir -p pieces && for archive in extras/*.tar; do tar -xf "$archive" -C pieces; done
          for name in Linux Windows macOS; do
            rm -rf stage && mkdir -p "stage/Tallow-$name" && cp -a pieces/. "stage/Tallow-$name/"
            (cd stage && zip -qr9 "../out/Tallow-$name.zip" "Tallow-$name")
          done
          unzip -l out/Tallow-macOS.zip | grep -E "TallowPlayer|libTallowPlayer" || true

      - name: Keep the complete zips
        uses: actions/upload-artifact@v4
        with:
          name: Tallow-packages
          path: out/*.zip

      - name: Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          short="${GITHUB_SHA:0:7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"; title="Tallow ${GITHUB_REF_NAME}"; pre=""
          else
            tag="$TALLOW_VERSION"; title="Tallow Engine $TALLOW_VERSION"; pre="--prerelease"
          fi
          notes="Built from Tallow $short ($GITHUB_REF_NAME).

          - **Tallow-Windows.zip**: unzip and run Tallow.exe.
          - **Tallow-Linux.zip**: unzip and run ./Tallow.
          - **Tallow-Platform-Android.zip**: the Android platform; Tallow downloads it itself when you add Android in the Build window's Platforms (it needs Android Studio installed).
          - **Tallow-macOS.zip** (Intel Macs; Apple silicon untested): unzip, then run \`xattr -dr com.apple.quarantine <folder>\` once (Tallow is not signed with an Apple Developer ID, so macOS blocks it otherwise), and run ./Tallow.

          Tallow installs the .NET SDK it needs on first start; no Beef compiler or Python is needed. Any of them exports Linux, Windows, macOS and web games. NativeAOT: Windows games on Windows (with the Visual Studio C++ Build Tools), Linux games on any machine once Tallow has installed Zig (project selector), macOS games on a Mac.

          See tallow-package.txt in each for details."
          # Checksums, which Tallow Hub checks downloads against.
          (cd out && sha256sum *.zip > SHA256SUMS.txt)
          gh release create "$tag" out/*.zip out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $pre
